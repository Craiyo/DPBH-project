<!DOCTYPE html>
<html>
  <head>
    <title>Extension</title>
    <script src="popup.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


  <link rel="icon" type="image/x-icon" href="./assets/Darkforces.png">
  </head>
  <body>
    <div class="background">
      <div class="heading"><h3>THE DARK FORCES</h3></div>
      <div class="part-1">part1</div>
      <div class="part-2">
        part2
      </div>
      <hr>
     <div class="rating">
      <h6>Please Provide FeedBack:</h6>
        <!-- <br>
        <br> -->
       
        <div class="review-rating">
          <div class="form-group mb-3 me-5 commenter">
            <i class="fa-regular fa-message abc" onclick="toggleCommentBox() "></i>
            <form class="Comment" id="commentBox">
              <textarea class="form-control" id="comment" rows="1" cols="10"></textarea>
            </form>
          </div>
        <div class="rating mb-3 ">
          <fieldset class="starability-heart">
            <input type="radio" id="no-rate" class="input-no-rate"  value="0" checked aria-label="No rating." />
            <input type="radio" id="first-rate1" name="reviews[rating]" value="1" />
            <label for="first-rate1" title="Terrible">1 star</label>
            <input type="radio" id="first-rate2" name="reviews[rating]" value="2" />
            <label for="first-rate2" title="Not good">2 stars</label>
            <input type="radio" id="first-rate3" name="reviews[rating]" value="3" />
            <label for="first-rate3" title="Average">3 stars</label>
            <input type="radio" id="first-rate4" name="reviews[rating]" value="4" />
            <label for="first-rate4" title="Very good">4 stars</label>
            <input type="radio" id="first-rate5" name="reviews[rating]" value="5" />
            <label for="first-rate5" title="Amazing">5 stars</label>
          </fieldset>
        </div>

      
    
      </div>
      
     </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>
</html>
