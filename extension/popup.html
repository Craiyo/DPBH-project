<!-- popup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dark Forces Extension</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var audioIcon = document.getElementById('audio-icon');

      audioIcon.addEventListener('click', function() {
        audioIcon.classList.toggle('active');
      });
    });
    function toggleAudio() {
        var audioControl = document.getElementById('audio-control');
        audioControl.classList.toggle('crossed-out');
    }
  </script>
</head>
<body>
  <div class="background-gif"></div>
  <div class="popup-container">
    <div id="background-gif" style="background: url('./assets/Green Purple Grainy Gradient Thank You Facebook Video.gif') center center / cover no-repeat fixed;"></div>
    <div class="header">
      <div  class="line">
        <h1 class="extension-name" style="width:650px">The Dark Forces</h1>
        <div class="audio-control" id="audio-control" onclick="toggleAudio()">
          <i class="fas fa-volume-high" id="audio-icon"></i>
          <i class="fa-solid fa-volume-xmark"></i>
      </div>
      </div>
     <br>
      <p class="part2">"Empowering Users Against Dark Patterns"</p>
      <ul class="dark-patterns-list">
        <p class="part3">Detected Dark pattern</p>
        <li>False Urgency</li>
        <li>Confirm shaming</li>
        <li>Forced Action</li>
      </ul>
    </div>
    <div class="controls" style="margin-top: 90px;">
      <div class="toggle-button" id="toggle1">
        <span class="toggle-name namee" id="togg1">Suggest Alt. options</span>
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-button" id="toggle2">
        <span class="toggle-name">Hide the Dark Patterns</span>
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
      
      </div>
<br>
<br>
<br>

      <div class="feedback-section" style="margin-top: -18px">
      <p class="feedback-label">Rate your experience:</p>
      <div class="rating">
        <label class="form-label" for="rating"></label>
        <fieldset class="starability-heart">
          <input type="radio" id="no-rate" class="input-no-rate" name="reviews[rating]" value="0" checked aria-label="No rating." />
          <input type="radio" id="first-rate1" name="reviews[rating]" value="1" />
          <label for="first-rate1" title="Terrible">1 star</label>
          <input type="radio" id="first-rate2" name="reviews[rating]" value="2" />
          <label for="first-rate2" title="Not good">2 stars</label>
          <input type="radio" id="first-rate3" name="reviews[rating]" value="3" />
          <label for="first-rate3" title="Average">3 stars</label>
          <input type="radio" id="first-rate4" name="reviews[rating]" value="4" />
          <label for="first-rate4" title="Very good">4 stars</label>
          <input type="radio" id="first-rate5" name="reviews[rating]" value="5" />
          <label for="first-rate5" title="Amazing">5 stars</label>
        </fieldset>
       
      </div>
        
      </div>
    </div>
  </div>
</body>
</html>
